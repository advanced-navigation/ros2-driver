[workspace]
name = "adnav_driver"
channels = [
  "http://localhost:12222/general",
  "https://prefix.dev/robostack-kilted",
  "https://prefix.dev/conda-forge",
]
platforms = ["linux-64", "linux-aarch64"]
preview = ["pixi-build"]

[dependencies]
adnav_driver = { path = "." }

[package]
name        = "adnav_driver"
version     = "2.2.0"
description = "Advanced Navigation ROS 2 Driver"
license     = "LicenseRef-Proprietary"
authors     = ["Greenroom Robotics <software-team@greenroomrobotics.com>"]

[package.build.backend]
name    = "pixi-build-ros-gr"
version = ">=0.4,<0.5"

[package.build.config]
mode         = "pixi-native"
build-type   = "ament_cmake"
distro       = "kilted"
build-number = 1

[package.host-dependencies]
ros-kilted-ament-cmake                = "*"
ros-kilted-ament-cmake-cpplint        = "*"
ros-kilted-rclcpp                     = "*"
ros-kilted-std-msgs                   = "*"
ros-kilted-sensor-msgs                = "*"
ros-kilted-diagnostic-updater         = "*"
ros-kilted-geometry-msgs              = "*"
ros-kilted-geographic-msgs            = "*"
ros-kilted-tf2                        = "*"
ros-kilted-tf2-geometry-msgs          = "*"
ros-kilted-std-srvs                   = "*"
ros-kilted-generate-parameter-library = "*"
uvw_vendor                            = "*"
adnav_interfaces                      = "==2.2.1"

[package.run-dependencies]
ros-kilted-rclcpp                     = "*"
ros-kilted-std-msgs                   = "*"
ros-kilted-sensor-msgs                = "*"
ros-kilted-diagnostic-updater         = "*"
ros-kilted-geometry-msgs              = "*"
ros-kilted-geographic-msgs            = "*"
ros-kilted-tf2                        = "*"
ros-kilted-tf2-geometry-msgs          = "*"
ros-kilted-std-srvs                   = "*"
ros-kilted-generate-parameter-library = "*"
uvw_vendor                            = "*"
adnav_interfaces                      = "==2.2.1"

# Test env builds the package from source with colcon (deb parity),
# so it needs the build (host) deps as well as the test deps.
[feature.tests.dependencies]
# conda toolchain: keeps colcon include/link paths inside the env
cxx-compiler                          = "*"
cmake                                 = "*"
make                                  = "*"
pkg-config                            = "*"
ros-kilted-ament-cmake                = "*"
ros-kilted-ament-cmake-cpplint        = "*"
ros-kilted-rclcpp                     = "*"
ros-kilted-std-msgs                   = "*"
ros-kilted-sensor-msgs                = "*"
ros-kilted-diagnostic-updater         = "*"
ros-kilted-geometry-msgs              = "*"
ros-kilted-geographic-msgs            = "*"
ros-kilted-tf2                        = "*"
ros-kilted-tf2-geometry-msgs          = "*"
ros-kilted-std-srvs                   = "*"
ros-kilted-generate-parameter-library = "*"
uvw_vendor                            = "*"
adnav_interfaces                      = "==2.2.1"
colcon-common-extensions              = "*"

[feature.tests.tasks]
test = "colcon build && (LD_PRELOAD=$CONDA_PREFIX/lib/libpython3.so colcon test --event-handlers console_direct+ || true) && colcon test-result --all --verbose"

[environments]
tests = { features = ["tests"], no-default-feature = true }
